function wheelSVG(sel,fam){
  const total=WHEEL.reduce((t,f)=>t+f.m.reduce((u,m)=>u+m[1].length,0),0),st=360/total;
  const P=(r,a)=>{const t=a*Math.PI/180;return [(r*Math.sin(t)).toFixed(2),(-r*Math.cos(t)).toFixed(2)]};
  const arc=(r0,r1,a0,a1)=>{const L=a1-a0>180?1:0,[x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);return `M${x0} ${y0}A${r1} ${r1} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${L} 0 ${x3} ${y3}Z`};
  const seg=(cls,name,path,r0,r1,a0,a1,fill,fs)=>{const am=(a0+a1)/2,rm=(r0+r1)/2,[x,y]=P(rm,am),rot=am<=180?am-90:am+90,on=sel.has(name.toLowerCase());
    return `<g class="wseg ${cls}${on?' on':''}${fam&&path.split('|')[0]===fam?' f':''}" data-act="wheel" data-v="${esc(name)}" data-path="${esc(path)}" role="button" tabindex="0" aria-pressed="${on}" aria-label="${esc(name)}"><path d="${arc(r0,r1,a0,a1)}" fill="${fill}"/><text x="${x}" y="${y}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot.toFixed(2)} ${x} ${y})">${esc(name)}</text></g>`};
  let a=0,out='';
  WHEEL.forEach(f=>{const fa=a;f.m.forEach(([mn,leaves])=>{const ma=a;leaves.forEach(l=>{out+=seg('leaf',l,f.n+'|'+mn+'|'+l,338,496,a,a+st,f.c[2],13);a+=st});out+=seg('mid',mn,f.n+'|'+mn,178,338,ma,a,f.c[1],14.5)});out+=seg('core',f.n,f.n,46,178,fa,a,f.c[0],22)});
  return `<svg viewBox="-500 -500 1000 1000" role="group" aria-label="Круг эмоций">${out}<circle r="46" fill="#fff" opacity=".85"/></svg>`
}

function head(){
  const st=STEPS[S.step];
  return `<div class="qhead"><span class="k">${esc(st.t)}</span><span class="counter">${S.step+1} / ${STEPS.length}</span></div>
  <div class="ticks" style="grid-template-columns:repeat(${STEPS.length},1fr)">${STEPS.map((_,i)=>`<i class="${i<S.step?'done':i===S.step?'cur':''}"></i>`).join('')}</div>`
}
function title(q){const st=STEPS[S.step];return `<div class="qtitle">${st.l?`<span class="letter" aria-hidden="true">${st.l}</span>`:''}<h2 class="question">${q}</h2></div>`}
function wrap(inner){return `<div class="quiz screen">${head()}${inner}</div>`}

function stepS(){const e=S.entry;return wrap(`${title('Что произошло?')}
  ${e.origin==='wheel'&&e.emotions.length?`<div class="guide"><strong>Вы начали с чувства</strong>${esc(e.emotions.map(x=>x.name).join(', '))}. Вспомните, когда это состояние появилось или заметно усилилось. Что происходило прямо перед этим? Силу чувства отметим на третьем шаге.</div>`:''}
  <p class="hint">Опишите ситуацию как камера видеонаблюдения: где, когда, кто был рядом, что было сказано или сделано. Только факты, без оценок. Ситуацией может быть и внутреннее событие: воспоминание, телесное ощущение, мысль.</p>
  <div class="panel"><textarea data-f="situation" aria-label="Ситуация" placeholder="Например: вторник, вечер. Отправила подруге длинное сообщение, прошло три часа, ответа нет.">${esc(e.situation)}</textarea></div>`)}

function stepM(){const e=S.entry;return wrap(`${title('Что пронеслось в голове?')}
  <p class="hint">Запишите мысль так, как она прозвучала, от первого лица. Если вместо мысли был образ, опишите его. Если мыслей несколько, выберите ту, что задела сильнее всего.</p>
  <ul class="prompts"><li>Что я подумал(а) в этот момент?</li><li>Что, как мне показалось, это значит?</li><li>Чего я испугался(ась)?</li></ul>
  <div class="panel"><span class="lab">Автоматическая мысль</span><textarea data-f="thought" placeholder="Например: «Я ей надоела, она просто не хочет со мной общаться».">${esc(e.thought)}</textarea>
  <span class="lab">Насколько Вы верите в эту мысль</span>${range('thoughtBelief',e.thoughtBelief,'',['совсем не верю','полностью'])}</div>`)}

function stepE(){const e=S.entry;const names=e.emotions.map(x=>x.name);const extra=names.filter(n=>!EMOTIONS.includes(n));
  return wrap(`${title('Что Вы почувствовали?')}
  <p class="hint">Выберите одно или несколько чувств и отметьте, насколько каждое было сильным. Эмоцию обычно можно назвать одним словом.</p>
  <div class="panel"><span class="lab">Чувства</span>${chipsHTML(EMOTIONS.concat(extra),names,'emo')}
   <div class="addrow"><input type="text" id="emoCustom" placeholder="Другое чувство" aria-label="Другое чувство"><button class="ghost" data-act="emoAdd">Добавить</button></div>

   ${S.wheelOpen?`<p class="hint">Нажмите на чувство в круге или в списке под ним, и оно добавится к выбранным. Повторное нажатие уберёт его.</p><div style="margin-top:14px">${wheelBlock(new Set(names))}</div>${navPanel('pick')}`:''}</div>
   ${e.emotions.length?`<span class="lab">Сила, от 0 до 100</span>${e.emotions.map((x,i)=>`<div class="emo-row">${range('emotions.'+i+'.before',x.before,esc(x.name))}</div>`).join('')}`:''}
  </div>
  <div class="panel"><span class="lab">Что происходило в теле</span>${chipsHTML(BODY,e.body,'body')}
   <div class="addrow"><input type="text" data-f="bodyText" value="${esc(e.bodyText)}" placeholder="Своими словами, если хочется" aria-label="Телесные ощущения своими словами"></div>
   <span class="lab">Общее напряжение в теле</span>${range('tension',e.tension,'',['расслаблено','очень напряжено'])}</div>`)}

function stepR(){const e=S.entry;return wrap(`${title('Что Вы сделали?')}
  <p class="hint">Как Вы отреагировали, что сделали или очень захотели сделать. Здесь нет правильных и неправильных ответов.</p>
  <div class="panel">${chipsHTML(REACT,e.reactTags,'react')}<span class="lab">Своими словами</span>
  <textarea data-f="reaction" placeholder="Например: несколько раз проверяла телефон, потом написала ещё одно сообщение с извинениями.">${esc(e.reaction)}</textarea></div>`)}

function stepPause(){return wrap(`${title('Цепочка записана')}
  <p class="hint">Вы уже сделали главное: замедлились и увидели, как ситуация, мысль, чувство и действие связаны между собой. Это полноценная запись, и на ней можно остановиться. Если есть силы, можно пойти дальше и проверить мысль на прочность.</p>
  <div class="answers">${answer('go',IDX('dist'),false,'Продолжить и проверить мысль','Ещё 10–15 минут')}${answer('go',LAST,false,'Остановиться на этом','Сохранить запись и при желании отметить, что обсудить на встрече')}</div>`)}

function stepDist(){const e=S.entry;return wrap(`${title('Какие ошибки мышления здесь есть?')}
  <div class="thought-quote">«${esc(e.thought||'…')}»</div>
  <p class="hint">Отметьте искажения, которые узнаёте в этой мысли. Их часто бывает несколько. Если сомневаетесь, раскройте описание.</p>
  <div class="dists">${DIST.map(d=>{const on=e.distortions.includes(d.id);return `<div class="dist${on?' on':''}">
    <button class="dist-h" data-act="dist" data-v="${d.id}" aria-pressed="${on}"><i class="diamond"></i><b>${d.n}</b></button>

    <details><summary>Подробнее</summary><dl><dt>Как звучит</dt><dd>${d.m}</dd><dt>Пример</dt><dd>${d.e}</dd><dt>Вопрос себе</dt><dd class="q">${d.q}</dd></dl></details></div>`}).join('')}</div>`)}

function stepEvid(){const e=S.entry;return wrap(`${title('Проверим мысль на прочность')}
  <p class="hint">Попробуйте посмотреть на мысль как исследователь, а не как адвокат или обвинитель. Задача не доказать, что она ложная, а увидеть всю картину.</p>
  <ul class="prompts">${EVID_Q.map(q=>`<li>${q}</li>`).join('')}</ul>
  <div class="panel"><span class="lab">Что говорит в пользу мысли</span><textarea data-f="evFor" placeholder="Только факты, которые можно было бы показать другому человеку">${esc(e.evFor)}</textarea>
  <span class="lab">Что говорит против неё</span><textarea data-f="evAgainst" placeholder="Даже небольшие факты и исключения">${esc(e.evAgainst)}</textarea></div>`)}

function stepAlt(){const e=S.entry;const qs=DIST.filter(d=>e.distortions.includes(d.id));return wrap(`${title('Как ещё можно на это посмотреть?')}
  <p class="hint">Сформулируйте более сбалансированную мысль. Она не обязана быть позитивной, ей важно быть точной и учитывать все факты, в том числе неприятные.</p>
  ${qs.length?`<ul class="prompts">${qs.map(d=>`<li>${d.q}</li>`).join('')}</ul>`:''}
  <div class="panel"><span class="lab">Новый взгляд</span><textarea data-f="alternative" placeholder="Например: «Она могла быть занята. Раньше она всегда отвечала, пусть и не сразу. Если что-то не так, я могу спросить».">${esc(e.alternative)}</textarea>
  <span class="lab">Насколько Вы верите в новую мысль</span>${range('altBelief',e.altBelief,'',['совсем не верю','полностью'])}</div>
  <div class="guide"><strong>Если не получается</strong>Если новая мысль не идёт или кажется фальшивой, это не провал. Иногда исходная мысль держится на чём-то более глубоком. Запишите то, что получается, и отметьте это для встречи.</div>`)}

function rows(e,withBody){
  const r=[{t:'Вера в мысль',b:e.thoughtBelief,a:e.thoughtBeliefAfter}].concat(e.emotions.map(x=>({t:x.name,b:x.before,a:x.after})));
  if(withBody)r.push({t:'Напряжение в теле',b:e.tension,a:e.tensionAfter});
  return r}
function atlas(list,note){
  return `<div class="atlas"><div class="atlas-head"><span>До и после</span><span class="legend"><span><i style="background:var(--rose)"></i>было</span><span><i style="background:var(--sage2)"></i>сейчас</span></span></div>
  ${list.map(r=>{const a=r.a==null?r.b:r.a,lo=Math.min(a,r.b),hi=Math.max(a,r.b);return `<div class="axis-row"><div class="axis-name">${esc(r.t)}</div>
   <div class="axis-track"><div class="axis-span" style="left:${lo}%;width:${hi-lo}%"></div><i class="dot b" style="left:${r.b}%"></i><i class="dot a" style="left:${a}%"></i></div>
   <div class="axis-val">${r.b} → <b>${a}</b></div></div>`}).join('')}
  ${note?`<p class="atlas-note">${note}</p>`:''}</div>`}

function stepRe(){const e=S.entry;if(e.thoughtBeliefAfter==null)e.thoughtBeliefAfter=e.thoughtBelief;e.emotions.forEach(x=>{if(x.after==null)x.after=x.before});
  return wrap(`${title('Что изменилось?')}
  <p class="hint">Вернитесь к исходной мысли и чувствам и оцените их ещё раз, как сейчас. Даже небольшое снижение имеет значение. Если ничего не поменялось, это тоже честный результат.</p>
  <div class="thought-quote">«${esc(e.thought||'…')}»</div>
  <div class="panel"><span class="lab">Вера в исходную мысль сейчас</span>${range('thoughtBeliefAfter',e.thoughtBeliefAfter)}
  ${e.emotions.length?`<span class="lab">Сила чувств сейчас</span>${e.emotions.map((x,i)=>`<div class="emo-row">${range('emotions.'+i+'.after',x.after,esc(x.name))}</div>`).join('')}`:''}</div>
  <div id="cmp">${atlas(rows(e,false))}</div>`)}

function stepScan(){const e=S.entry;if(e.tensionAfter==null)e.tensionAfter=e.tension;
  return wrap(`${title('Как Вы сейчас?')}
  <p class="hint">Прежде чем идти дальше, ненадолго остановитесь. Сделайте пару спокойных вдохов, выдыхая чуть медленнее, чем вдыхаете. Пройдитесь вниманием по телу сверху вниз: лицо и челюсть, шея и плечи, грудь и дыхание, живот, руки, ноги.</p>
  <span class="lab" style="margin-top:28px">В целом стало ли полегче?</span>
  <div class="answers" style="margin-top:6px">${RELIEF.map(r=>answer('relief',r.id,e.relief===r.id,r.n,r.s)).join('')}</div>
  ${e.relief==='worse'?`<div class="guide"><strong>Так тоже бывает</strong>Когда мы приближаемся к важному, чувства иногда сначала усиливаются. Это не значит, что Вы сделали что-то не так. Можно остановиться здесь, сохранить запись и принести её на встречу. Следующий шаг лучше отложить.</div>`:''}
  ${e.body.length?`<div class="panel"><span class="lab">Ощущения, которые Вы отмечали в начале</span>
   ${e.body.map(b=>`<div class="emo-row"><div class="range nolbl" style="grid-template-columns:1fr"><span class="rl" style="font-family:var(--serif);font-size:20px">${esc(b)}</span></div>
   <div class="chips">${BODYNOW.map(([id,n])=>`<button class="chip${e.bodyNow[b]===id?' on':''}" data-act="bnow" data-b="${esc(b)}" data-v="${id}" aria-pressed="${e.bodyNow[b]===id}">${n}</button>`).join('')}</div></div>`).join('')}</div>`:''}
  <div class="panel"><span class="lab">Общее напряжение в теле сейчас</span>${range('tensionAfter',e.tensionAfter,'',['расслаблено','очень напряжено'])}
   <span class="lab">Где в теле Вы сейчас больше всего себя чувствуете?</span>${chipsHTML(ZONES,e.zones,'zone')}
   <span class="lab">Что Вы там замечаете</span>
   <textarea data-f="scanNote" style="min-height:90px" placeholder="Например: плечи опустились, но в груди ещё немного сжато. Дышать стало свободнее.">${esc(e.scanNote)}</textarea></div>
  <div id="cmp">${atlas(rows(e,true),'Иногда тело отпускает позже, чем мысль. А иногда наоборот: мысль ещё держится, а дыхание уже стало свободнее. И то и другое важно заметить.')}</div>`)}

function stepDeep(){const e=S.entry;
  if(!S.deepOpen)return wrap(`${title('Что стоит за этой мыслью?')}
  <p class="hint">Автоматические мысли часто вырастают из глубинных убеждений, давних и очень устойчивых представлений о себе, других и мире. Обычно они складываются в детстве и звучат коротко и категорично: «я не справлюсь», «меня нельзя любить», «со мной что-то не так».</p>
  <div class="guide"><strong>Этот шаг необязательный</strong>Работа с глубинным убеждением может задевать болезненные воспоминания и сильные чувства. Одного протокола обычно недостаточно, чтобы его изменить: это постепенная работа. Делайте ровно столько, сколько комфортно. Если становится тяжело или ответы не идут, остановитесь, и мы продолжим это вместе на встрече.</div>
  <div class="answers">${answer('deepOpen','',false,'Попробовать','Спуститься от мысли к убеждению и задать ему несколько вопросов')}${answer('deepSkip','',false,'Оставить на встречу','Перейти к итогу и отметить, что хочется разобрать глубже')}</div>`);
  return wrap(`${title('Спуск к убеждению')}
  <p class="hint">Отвечайте на каждый вопрос, исходя из предыдущего ответа. Остановитесь, когда появится короткая фраза о себе, от которой становится особенно больно или тревожно.</p>
  <div class="panel"><span class="lab">Допустим, мысль верна. Что это значит обо мне?</span><div class="thought-quote" style="margin:0 0 12px;font-size:19px;padding:12px 18px">«${esc(e.thought||'…')}»</div>
   <textarea data-f="arrow1" style="min-height:80px">${esc(e.arrow1)}</textarea>
   <span class="lab">А если и это правда, что это говорит обо мне как о человеке?</span><textarea data-f="arrow2" style="min-height:80px">${esc(e.arrow2)}</textarea>
   <span class="lab">Как это звучит одной короткой фразой</span><input type="text" data-f="core" value="${esc(e.core)}" placeholder="«Я…»"></div>
  <span class="lab" style="margin-top:32px">На что это похоже</span>
  <p class="hint" style="margin-top:0">Глубинные убеждения о себе чаще всего относятся к одной из трёх групп.</p>
  <div class="answers" style="margin-top:12px">${CLUSTERS.map(c=>answer('cluster',c.id,e.cluster===c.id,c.n,c.e)).join('')}</div>
  <div class="panel"><span class="lab">Насколько Вы верите в это убеждение</span>${range('coreBelief',e.coreBelief,'',['совсем не верю','полностью'])}</div>
  <h2 class="question" style="font-size:clamp(30px,3.6vw,42px);margin-top:44px">Вопросы к убеждению</h2>
  <p class="hint">Не нужно отвечать на всё. Выберите один-два блока, которые откликаются, и запишите, что приходит.</p>
  <div class="panel">${BLOCKS.map(b=>{const v=e.blocks[b.id]||'';return `<details class="blk"><summary><span>${b.n}</span>${v?'<span class="filled">есть ответ</span>':''}</summary><div class="inner">
    ${b.warn?'<p class="caution">Этот блок может поднимать детские воспоминания. Если становится тяжело, остановитесь и оставьте его для встречи.</p>':''}
    <ul class="prompts">${b.q.map(q=>`<li>${q}</li>`).join('')}</ul>
    <textarea data-f="blocks.${b.id}" style="min-height:90px" aria-label="${esc(b.n)}">${esc(v)}</textarea></div></details>`}).join('')}</div>
  <h2 class="question" style="font-size:clamp(30px,3.6vw,42px);margin-top:44px">Новое убеждение</h2>
  <p class="hint">Как могло бы звучать более точное и бережное убеждение о себе? Например: «Я достоин любви, даже когда ошибаюсь», «Я справляюсь с большим, чем мне кажется». Нормально, если пока в него почти не верится.</p>
  <div class="panel"><input type="text" data-f="newBelief" value="${esc(e.newBelief)}" placeholder="«Я…»" aria-label="Новое убеждение">
   <span class="lab">Вера в новое убеждение</span>${range('newBeliefStrength',e.newBeliefStrength)}
   <span class="lab">Вера в старое убеждение сейчас</span>${range('coreBeliefAfter',e.coreBeliefAfter==null?e.coreBelief:e.coreBeliefAfter)}</div>
  <p class="hint">Новое убеждение укрепляется постепенно. В ближайшие дни можно замечать небольшие события, которые с ним согласуются.</p>`)}

function flagText(e){const a=[];if(e.flags.feel)a.push('Поднялись сильные переживания');if(e.flags.hard)a.push('Было трудно, мысль не шла');if(e.flags.deeper)a.push('Хочу разобрать глубже с психологом');return a}
function summaryHTML(e,ro){
  const d=DIST.filter(x=>e.distortions.includes(x.id)).map(x=>x.n);const cl=CLUSTERS.find(c=>c.id===e.cluster);const rel=RELIEF.find(r=>r.id===e.relief);
  const it=(t,v)=>v?`<dt>${t}</dt><dd>${esc(v)}</dd>`:'';
  const ch=(b,a)=>a!=null&&a!==b?` → ${a}`:'';
  const bn=e.body.filter(b=>e.bodyNow[b]).map(b=>b+': '+BODYNOW.find(x=>x[0]===e.bodyNow[b])[1]);
  return `<dl class="sum">
   ${it('Ситуация',e.situation)}
   ${e.thought?`<dt>Мысль</dt><dd class="big">«${esc(e.thought)}»<small>${e.thoughtBelief}%${ch(e.thoughtBelief,e.thoughtBeliefAfter)}${e.thoughtBeliefAfter!=null&&e.thoughtBeliefAfter!==e.thoughtBelief?'%':''}</small></dd>`:''}
   ${e.emotions.length?`<dt>Эмоции</dt><dd>${e.emotions.map(x=>`${esc(x.name)} ${x.before}${ch(x.before,x.after)}`).join(', ')}</dd>`:''}
   ${(e.body.length||e.bodyText)?`<dt>Тело</dt><dd>${esc(e.body.concat(e.bodyText?[e.bodyText]:[]).join(', '))}. Напряжение ${e.tension}${ch(e.tension,e.tensionAfter)}</dd>`:''}
   ${(e.reactTags.length||e.reaction)?`<dt>Реакция</dt><dd>${esc([e.reactTags.join(', '),e.reaction].filter(Boolean).join('\n'))}</dd>`:''}
   ${d.length?`<dt>Ошибки мышления</dt><dd>${esc(d.join(', '))}</dd>`:''}
   ${it('В пользу мысли',e.evFor)}${it('Против мысли',e.evAgainst)}
   ${e.alternative?`<dt>Новый взгляд</dt><dd class="big">«${esc(e.alternative)}»<small>${e.altBelief}%</small></dd>`:''}
   ${rel?`<dt>Стало ли полегче</dt><dd>${rel.n}${bn.length?'\n'+esc(bn.join(', ')):''}${e.zones.length?'\nБольше всего ощущается: '+esc(e.zones.join(', ')):''}${e.scanNote?'\n'+esc(e.scanNote):''}</dd>`:''}
   ${e.core?`<dt>Глубинное убеждение${cl&&cl.id!=='other'?`, ${cl.n.toLowerCase()}`:''}</dt><dd class="big">«${esc(e.core)}»<small>${e.coreBelief}%${ch(e.coreBelief,e.coreBeliefAfter)}</small></dd>`:''}
   ${BLOCKS.filter(b=>e.blocks[b.id]).map(b=>it(b.n,e.blocks[b.id])).join('')}
   ${e.newBelief?`<dt>Новое убеждение</dt><dd class="big">«${esc(e.newBelief)}»<small>${e.newBeliefStrength}%</small></dd>`:''}
   ${ro?it('Для встречи',e.sessionNote):''}
   ${ro&&flagText(e).length?`<dt>Отметки</dt><dd>${esc(flagText(e).join('\n'))}</dd>`:''}
  </dl>`}

function stepSum(){const e=S.entry;return wrap(`${title('Ваша запись')}
  <p class="hint">${fmtDate(e.date)}</p>
  <div class="panel">${summaryHTML(e,false)}</div>
  <h2 class="question" style="font-size:clamp(30px,3.6vw,42px);margin-top:44px">Для нашей встречи</h2>
  <div class="panel">
   <label class="check"><input type="checkbox" data-flag="feel" ${e.flags.feel?'checked':''}><span>Во время записи поднялись сильные переживания</span></label>
   <label class="check"><input type="checkbox" data-flag="hard" ${e.flags.hard?'checked':''}><span>Было трудно, мысль не шла или не получилось найти другой взгляд</span></label>
   <label class="check"><input type="checkbox" data-flag="deeper" ${e.flags.deeper?'checked':''}><span>Хочу разобрать это глубже вместе</span></label>
   <span class="lab" style="margin-top:20px">Что хочется обсудить</span>
   <textarea data-f="sessionNote" style="min-height:80px" placeholder="Необязательно">${esc(e.sessionNote)}</textarea></div>
  <div class="guide"><strong>Не нужно доделывать в одиночку</strong>Всё, что оказалось трудным или осталось незаконченным, принесите на встречу. Разберём вместе.</div>`)}

function listView(){const L=load(KEY,[]).slice().reverse();
  const c={};L.forEach(e=>(e.distortions||[]).forEach(id=>c[id]=(c[id]||0)+1));const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<div class="quiz screen"><p class="kicker">Архив</p><h2 class="question">Мои записи</h2>
  ${L.length>1&&top.length?`<div class="guide"><strong>Чаще всего встречаются</strong>${top.map(([id,n])=>{const d=DIST.find(x=>x.id===id);return `${d?d.n:id} (${n})`}).join(', ')}</div>`:''}
  <div style="margin-top:24px">${L.length?L.map(e=>{const f=e.flags&&(e.flags.feel||e.flags.hard||e.flags.deeper);return `<button class="entry-card" data-act="open" data-v="${e.id}"><small>${fmtDate(e.date)}</small>${f?'<span class="tag">для встречи</span>':''}${e.thought?`<div class="th">«${esc(e.thought.slice(0,140))}»</div>`:''}<div class="sit">${esc((e.situation||'Без описания ситуации').slice(0,120))}</div></button>`}).join(''):'<p class="hint">Здесь будут появляться сохранённые записи.</p>'}</div></div>`}

function openView(){const e=load(KEY,[]).find(x=>x.id===S.viewId);if(!e)return '<p class="hint">Запись не найдена.</p>';
  return `<div class="quiz screen"><p class="kicker">${fmtDate(e.date)}</p><h2 class="question">Запись</h2><div class="panel">${summaryHTML(norm(e),true)}</div></div>`}

function plain(e){e=norm(e);const d=DIST.filter(x=>e.distortions.includes(x.id)).map(x=>x.n);const L=[];const p=(t,v)=>{if(v)L.push(t+': '+v)};const ch=(b,a)=>a!=null&&a!==b?' → '+a:'';
  L.push('Дневник СМЭР, '+fmtDate(e.date));L.push('');
  p('Ситуация',e.situation);
  if(e.thought)p('Мысль','«'+e.thought+'» (вера '+e.thoughtBelief+'%'+ch(e.thoughtBelief,e.thoughtBeliefAfter)+')');
  if(e.emotions.length)p('Эмоции',e.emotions.map(x=>x.name+' '+x.before+ch(x.before,x.after)).join(', '));
  if(e.body.length||e.bodyText)p('Тело',e.body.concat(e.bodyText?[e.bodyText]:[]).join(', ')+'. Напряжение '+e.tension+ch(e.tension,e.tensionAfter));
  p('Реакция',[e.reactTags.join(', '),e.reaction].filter(Boolean).join('. '));
  p('Ошибки мышления',d.join(', '));p('В пользу мысли',e.evFor);p('Против мысли',e.evAgainst);
  if(e.alternative)p('Новый взгляд','«'+e.alternative+'» ('+e.altBelief+'%)');
  const rel=RELIEF.find(r=>r.id===e.relief);if(rel)p('Стало ли полегче',rel.n);
  const bn=e.body.filter(b=>e.bodyNow[b]).map(b=>b+': '+BODYNOW.find(x=>x[0]===e.bodyNow[b])[1]);p('Ощущения сейчас',bn.join(', '));
  p('Больше всего ощущается',e.zones.join(', '));p('Что замечаю в теле',e.scanNote);
  if(e.core)p('Глубинное убеждение','«'+e.core+'» ('+e.coreBelief+'%'+ch(e.coreBelief,e.coreBeliefAfter)+')');
  BLOCKS.forEach(b=>p(b.n,e.blocks[b.id]));
  if(e.newBelief)p('Новое убеждение','«'+e.newBelief+'» ('+e.newBeliefStrength+'%)');
  p('Отметки',flagText(e).join('; '));p('Для встречи',e.sessionNote);
  return L.join('\n')}
function copyText(t){const done=()=>toast('Запись скопирована');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Не удалось скопировать')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}

function render(keepScroll){
  let h='',n='';const y=window.scrollY;
  if(S.view==='home'){h=home()}
  else if(S.view==='list'){h=listView();n=`<button class="textbtn" data-act="home">На главную</button><button class="cta" data-act="new">Новая запись</button>`}
  else if(S.view==='open'){h=openView();n=`<button class="textbtn" data-act="del">Удалить</button><span class="grp"><button class="ghost" data-act="list">К записям</button><button class="cta" data-act="copyOpen">Скопировать</button></span>`}
  else{const k=STEPS[S.step].k;
    h=({s:stepS,m:stepM,e:stepE,r:stepR,pause:stepPause,dist:stepDist,evid:stepEvid,alt:stepAlt,re:stepRe,scan:stepScan,deep:stepDeep,sum:stepSum})[k]();
    if(k==='sum')n=`<button class="textbtn" data-act="back">Назад</button><span class="grp"><button class="ghost" data-act="copy">Скопировать</button><button class="cta" data-act="save">Сохранить</button></span>`;
    else if(k==='pause'||(k==='deep'&&!S.deepOpen))n=`<button class="textbtn" data-act="back">Назад</button><span></span>`;
    else if(k==='scan'&&S.entry.relief==='worse')n=`<button class="textbtn" data-act="back">Назад</button><span class="grp"><button class="ghost" data-act="next">Дальше</button><button class="cta" data-act="scanStop">К итогу</button></span>`;
    else n=`<button class="textbtn" data-act="back">${S.step===0?'Отмена':'Назад'}</button><button class="cta" data-act="next">${k==='deep'?'К итогу':'Дальше'}</button>`;}
  app.innerHTML=h;nav.hidden=!n;navIn.innerHTML=n;window.scrollTo(0,keepScroll?y:0);
}
function go(i){S.step=i;saveDraft();render()}

document.addEventListener('input',ev=>{const t=ev.target;if(!S.entry||!t.dataset.f)return;let v=t.value;
  if(t.type==='range'){v=+v;t.style.setProperty('--p',v+'%');const o=t.parentNode.querySelector('output');if(o)o.textContent=v}
  setPath(S.entry,t.dataset.f,v);saveDraft();
  if(t.type==='range'){const k=STEPS[S.step].k,c=document.getElementById('cmp');if(c&&k==='re')c.innerHTML=atlas(rows(S.entry,false));if(c&&k==='scan')c.innerHTML=atlas(rows(S.entry,true),'Иногда тело отпускает позже, чем мысль. А иногда наоборот: мысль ещё держится, а дыхание уже стало свободнее. И то и другое важно заметить.')}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.flag&&S.entry){S.entry.flags[t.dataset.flag]=t.checked;saveDraft()}});
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,e=S.entry;
  switch(a){
    case 'home':S.view='home';render();break;
    case 'new':S.navFam=null;S.wheelOpen=false;S.entry=newEntry();S.step=0;S.deepOpen=false;S.view='entry';saveDraft();render();break;
    case 'resume':{const d=load(DRAFT,null);if(d){S.entry=norm(d.entry);S.step=Math.min(d.step||0,LAST);S.deepOpen=!!(S.entry.core||S.entry.arrow1);S.view='entry';render()}break}
    case 'list':S.view='list';render();break;
    case 'open':S.viewId=v;S.view='open';render();break;
    case 'del':if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Нажмите ещё раз, чтобы удалить';b.style.color='var(--wine)';clearTimeout(b._t);b._t=setTimeout(()=>{b.dataset.armed='';b.textContent='Удалить';b.style.color=''},4000)}else{store(KEY,load(KEY,[]).filter(x=>x.id!==S.viewId));toast('Запись удалена');S.view='list';render()}break;
    case 'copyOpen':{const x=load(KEY,[]).find(y=>y.id===S.viewId);if(x)copyText(plain(x));break}
    case 'next':go(Math.min(S.step+1,LAST));break;
    case 'back':if(S.step===0){S.view='home';render()}else if(STEPS[S.step].k==='deep'&&S.deepOpen){S.deepOpen=false;render()}else{
      let p=S.step-1;if(S.step===LAST&&!e.alternative&&!e.distortions.length&&!e.evFor&&!e.evAgainst&&!e.core&&!e.relief)p=IDX('pause');go(p)}break;
    case 'go':go(+v);break;
    case 'emo':{const i=e.emotions.findIndex(x=>x.name===v);if(i<0)e.emotions.push({name:v,before:50,after:null});else e.emotions.splice(i,1);saveDraft();render(true);break}
    case 'emoAdd':{const inp=document.getElementById('emoCustom');const val=(inp.value||'').trim().toLowerCase();if(val&&!e.emotions.some(x=>x.name===val)){e.emotions.push({name:val,before:50,after:null});saveDraft();render(true)}break}
    case 'body':toggle(e.body,v);saveDraft();render(true);break;
    case 'react':toggle(e.reactTags,v);saveDraft();render(true);break;
    case 'zone':toggle(e.zones,v);saveDraft();render(true);break;
    case 'bnow':e.bodyNow[b.dataset.b]=v;saveDraft();render(true);break;
    case 'relief':e.relief=v;if(v==='worse')e.flags.feel=true;saveDraft();render(true);break;
    case 'scanStop':go(LAST);break;
    case 'wzoom':{S.wheelZoom=!S.wheelZoom;document.querySelectorAll('.wheel-wrap').forEach(w=>w.classList.toggle('zoom',S.wheelZoom));document.querySelectorAll('[data-act=wzoom]').forEach(x=>x.textContent=S.wheelZoom?'Уменьшить':'Увеличить');break}
    case 'wopen':S.wheelOpen=!S.wheelOpen;render(true);break;
    case 'wheel':case 'navpick':{const mode=S.view==='entry'?'pick':'home',fam=a==='wheel'?(b.dataset.path||'').split('|')[0]:(FAMOF[v.toLowerCase()]||{}).n;S.navFam=fam||S.navFam;const added=navToggle(v,mode);keepWheel(()=>render(true));if(mode==='pick')toast((added?'Добавлено: ':'Убрано: ')+v.toLowerCase());break}
    case 'navfam':S.navFam=v;keepWheel(()=>render(true));break;
    case 'navback':S.navFam=null;keepWheel(()=>render(true));break;
    case 'navclear':S.navSel=[];S.navFam=null;keepWheel(()=>render(true));break;
    case 'navstart':{S.entry=newEntry();S.entry.origin='wheel';S.entry.emotions=S.navSel.map(n=>({name:n,before:50,after:null}));S.navSel=[];S.navFam=null;S.step=0;S.deepOpen=false;S.view='entry';saveDraft();render();break}
    case 'gowheel':{const w=document.getElementById('wheel');if(w)w.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'dist':{toggle(e.distortions,v);saveDraft();const on=e.distortions.includes(v);b.closest('.dist').classList.toggle('on',on);b.setAttribute('aria-pressed',on);break}
    case 'cluster':e.cluster=v;saveDraft();render(true);break;
    case 'deepOpen':S.deepOpen=true;render();break;
    case 'deepSkip':e.flags.deeper=true;go(LAST);break;
    case 'save':saveEntry();toast('Запись сохранена');S.view='list';render();break;
    case 'copy':copyText(plain(e));break;
  }
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('wseg')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}if(ev.key==='Enter'&&ev.target.id==='emoCustom'){ev.preventDefault();const x=document.querySelector('[data-act=emoAdd]');if(x)x.click()}});
function saveEntry(){const L=load(KEY,[]);const i=L.findIndex(x=>x.id===S.entry.id);i<0?L.push(S.entry):L[i]=S.entry;store(KEY,L);drop(DRAFT);S.entry=null}

render();
})();
</script>
</body>
</html>
